name: Procurement branch checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/procurement-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Gateway and authorization smoke tests
        working-directory: server
        run: node test-security-smoke.js
